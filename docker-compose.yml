name: mirai-project
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./docker/php
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "${API_HTTP_PORT}:80"
    volumes:
      - ./apps/api:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --url http://nginx:80 --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx

  # Background jobs (Telegram; later email + PDF). After changing PHP code: docker compose restart queue
  queue:
    build: ./docker/php
    command: php artisan queue:work --tries=3 --timeout=120
    user: www-data
    restart: unless-stopped
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  # Fake PayWay for local payment tests: docker compose --profile mock up -d payway-mock
  payway-mock:
    image: node:24.22.2-alpine
    profiles: ["mock"]
    command: node /mock/server.js
    environment:
      PAYWAY_MOCK_SCENARIO: ${PAYWAY_MOCK_SCENARIO:-APPROVED}
    volumes:
      - ./docker/payway-mock:/mock:ro
    ports:
      - "${PAYWAY_MOCK_PORT:-4010}:4010" # host port for Postman / scenario switching

volumes:
  pgdata:
